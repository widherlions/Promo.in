<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>di promo.in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="images/logo.png" alt="Logo" class="logo">
    <h1>di promo.in</h1>

    <div class="header-buttons">
    <button onclick="checkoutWA()" class="btn-keranjang">
        🛒 Keranjang (<span id="jumlahKeranjang">0</span>)
    </button>

    <button onclick="kosongkanKeranjang()" class="btn-hapus">
        🗑️ Kosongkan Keranjang
    </button>
    </div>
    
    <input type="text" id="search" placeholder="Cari produk...">

    <div class="banner">
        🎉 Promo Spesial Hari Ini! Gratis Ongkir & Diskon Hingga 50%
    </div>
</header>

<div id="products" class="grid"></div>
    
<div id="modalKeranjang" class="modal">
  <div class="modal-content">
    <span class="close" onclick="tutupKeranjang()">&times;</span>

    <h2>🛒 Keranjang Belanja</h2>

    <div id="isiKeranjang"></div>

    <h3>Total: <span id="totalHarga">Rp0</span></h3>

    <button onclick="bukaKeranjang()" class="btn-keranjang">
      📲 Checkout WhatsApp
    </button>
  </div>
</div>
    
<script src="script.js"></script>
</body>
</html>
